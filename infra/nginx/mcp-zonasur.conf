upstream zonasur_mcp_upstream {
  server 127.0.0.1:3005;
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name mcp.zonasurtech.com;

  ssl_certificate /etc/letsencrypt/live/mcp.zonasurtech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mcp.zonasurtech.com/privkey.pem;

  client_max_body_size 1m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 30s;

  location /mcp {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header MCP-Session-Id $http_mcp_session_id;
    proxy_pass http://zonasur_mcp_upstream;
  }

  location /healthz {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://zonasur_mcp_upstream;
  }
}

server {
  listen 80;
  server_name mcp.zonasurtech.com;
  return 301 https://$host$request_uri;
}
